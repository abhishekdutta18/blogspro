# Included inside the blogspro.in HTTPS server block, before `location /`.
# ^~ makes these win over the static-file regex location.

location ^~ /auth/ {
    proxy_pass http://127.0.0.1:8787;
    include /etc/nginx/snippets/blogspro-api-proxy.conf;
}

location ^~ /api/ {
    proxy_pass http://127.0.0.1:8787;
    include /etc/nginx/snippets/blogspro-api-proxy.conf;
}
