<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Testing Platform — BlogsPro</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script>mermaid.initialize({ startOnLoad: false, theme: 'dark' });</script>
  
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
  <script>
    google.charts.load('current', {'packages':['corechart', 'bar', 'line']});
  </script>

  <style>
    :root {
      --bg: #080d1a;
      --card-bg: rgba(13, 19, 36, 0.7);
      --border: rgba(201, 168, 76, 0.15);
      --gold: #c9a84c;
      --gold-dim: rgba(201, 168, 76, 0.3);
      --emerald: #10b981;
      --red: #ef4444;
      --blue: #3b82f6;
      --cream: #f4f4f5;
      --muted: #a1a1aa;
      --cyan: #06b6d4;
      --purple: #a855f7;
      --mono: 'DM Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(201, 168, 76, 0.05) 0%, transparent 40%);
      color: var(--cream);
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: space-between;
      z-index: 100;
    }
    .brand { display: flex; align-items: center; gap: 0.75rem; }
    .brand h1 { font-family: 'Outfit', sans-serif; font-size: 1.1rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--gold); }
    .status-pill { font-size: 0.7rem; font-weight: 700; padding: 0.2rem 0.6rem; border-radius: 99px; border: 1px solid rgba(16, 185, 129, 0.3); }
    .status-pill.online { background: rgba(16, 185, 129, 0.1); color: var(--emerald); }
    .status-pill.offline { background: rgba(239, 68, 68, 0.1); color: var(--red); border-color: rgba(239, 68, 68, 0.3); }

    main {
      flex: 1;
      display: flex;
      gap: 1.5rem;
      padding: 1.5rem;
      overflow: hidden;
    }

    .pane {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    
    .pane.left { flex: 1; }
    .pane.right { flex: 2; }

    .pane-header {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .pane-title { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

    .pane-body {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--gold-dim) transparent;
    }
    
    .node-list { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
    .node-item { 
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 6px;
      padding: 0.75rem;
      display: flex; justify-content: space-between; align-items: center;
    }
    .node-name { font-family: var(--mono); font-size: 0.8rem; color: var(--cream); }
    .node-meta { font-size: 0.7rem; color: var(--muted); display: flex; gap: 0.5rem; }
    .node-tier { color: var(--gold); }

    .sandbox-form { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem; }
    textarea {
      width: 100%; height: 120px;
      background: rgba(0,0,0,0.3); border: 1px solid var(--border);
      color: var(--cream); border-radius: 6px; padding: 1rem;
      font-family: var(--mono); font-size: 0.8rem; resize: none;
    }
    textarea:focus { outline: none; border-color: var(--gold); }
    
    .controls { display: flex; gap: 1rem; align-items: center; }
    select {
      background: rgba(0,0,0,0.3); border: 1px solid var(--border);
      color: var(--cream); padding: 0.5rem 1rem; border-radius: 6px;
      font-family: var(--mono); font-size: 0.8rem;
    }
    button {
      background: rgba(201, 168, 76, 0.1); border: 1px solid var(--gold);
      color: var(--gold); padding: 0.5rem 1.5rem; border-radius: 6px;
      font-family: 'Outfit', sans-serif; font-weight: 600; cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { background: var(--gold); color: var(--bg); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #sandboxOutput {
      background: rgba(0,0,0,0.5);
      border-radius: 6px;
      padding: 1rem;
      min-height: 200px;
      font-size: 0.9rem;
      line-height: 1.6;
    }
    
    #sandboxOutput pre { background: rgba(0,0,0,0.5); padding: 1rem; border-radius: 4px; overflow-x: auto; font-family: var(--mono); font-size: 0.8rem; }
    #sandboxOutput p { margin-bottom: 1rem; }

    .loader { display: none; border: 2px solid var(--border); border-top: 2px solid var(--gold); border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>Developer Testing Platform</h1>
    </div>
    <div id="serverStatus" class="status-pill offline">API Server: Offline</div>
  </header>

  <main>
    <div class="pane left">
      <div class="pane-header">
        <span class="pane-title">AI Fleet Health</span>
        <button id="refreshHealthBtn" style="padding: 0.2rem 0.5rem; font-size: 0.7rem;">Refresh</button>
      </div>
      <div class="pane-body">
        <ul id="nodeList" class="node-list">
          <div style="text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 2rem;">Loading fleet status...</div>
        </ul>
      </div>
    </div>

    <div class="pane right">
      <div class="pane-header">
        <span class="pane-title">Generation Sandbox</span>
      </div>
      <div class="pane-body">
        <div class="sandbox-form">
          <textarea id="promptInput" placeholder="Enter a prompt to test the local AI Server... (e.g. 'Global Equities', 'NVIDIA', 'Federal Reserve')"></textarea>
          
          <div class="pane-title" style="margin-top: 0.5rem; margin-bottom: 0.5rem;">Individual Component Tests</div>
          <div class="controls" style="flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem;">
            <button id="testNewsBtn" style="font-size: 0.8rem; padding: 0.4rem 0.8rem; background: rgba(59, 130, 246, 0.1); border-color: var(--blue); color: var(--blue);">Test News API</button>
            <button id="testWeatherBtn" style="font-size: 0.8rem; padding: 0.4rem 0.8rem; background: rgba(6, 182, 212, 0.1); border-color: var(--cyan); color: var(--cyan);">Test Weather API</button>
            <button id="testMarketBtn" style="font-size: 0.8rem; padding: 0.4rem 0.8rem; background: rgba(16, 185, 129, 0.1); border-color: var(--emerald); color: var(--emerald);">Test Market API</button>
            <button id="testEconBtn" style="font-size: 0.8rem; padding: 0.4rem 0.8rem; background: rgba(168, 85, 247, 0.1); border-color: #a855f7; color: #a855f7;">Test Macro Pulse</button>
            <button id="testStockBtn" style="font-size: 0.8rem; padding: 0.4rem 0.8rem; background: rgba(16, 185, 129, 0.1); border-color: #10b981; color: #10b981;">Test Stock Engine</button>
            <button id="testPredictiveBtn" style="font-size: 0.8rem; padding: 0.4rem 0.8rem; background: rgba(245, 158, 11, 0.1); border-color: #f59e0b; color: #f59e0b;">Test Predictive</button>
            <button id="testBacktestBtn" style="font-size: 0.8rem; padding: 0.4rem 0.8rem; background: rgba(239, 68, 68, 0.1); border-color: var(--red); color: var(--red);">Test Backtest</button>
          </div>

          <div class="controls" style="border-top: 1px solid var(--border); padding-top: 1rem;">
            <button id="testInstitutionalPipelineBtn" style="background: var(--gold); color: var(--bg); width: 100%; font-size: 1.1rem; padding: 1rem;">Run All Data Sources Simultaneously & Generate Article</button>
            <div id="loadingIndicator" class="loader"></div>
          </div>
        </div>
        
        <div class="pane-title" style="margin-bottom: 1rem; border-top: 1px solid var(--border); padding-top: 1rem;">Output Trace</div>
        <div id="sandboxOutput">
          <span style="color: var(--muted); font-style: italic;">Awaiting input...</span>
        </div>
      </div>
    </div>
  </main>

  <!-- Application Logic -->
  <script src="js/dev-platform.js?v=2.0"></script>
</body>
</html>
