<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse Dashboard — BlogsPro</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
  
  <style>
    :root {
      --bg: #080d1a;
      --card-bg: rgba(13, 19, 36, 0.6);
      --border: rgba(201, 168, 76, 0.15);
      --gold: #c9a84c;
      --gold-dim: rgba(201, 168, 76, 0.3);
      --emerald: #10b981;
      --red: #ef4444;
      --cream: #f4f4f5;
      --muted: #a1a1aa;
      --mono: 'DM Mono', monospace;
      --sans: 'DM Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: var(--bg);
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.03) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(201, 168, 76, 0.05) 0%, transparent 40%);
      color: var(--cream);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ────────────────────────────────────────── */
    header {
      padding: 1.25rem 2rem;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
      background: rgba(8, 13, 26, 0.85);
    }
    
    .brand { display: flex; align-items: center; gap: 1rem; }
    .brand h1 { font-family: 'Outfit', sans-serif; font-size: 1.2rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--gold); }
    
    .header-right { display: flex; align-items: center; gap: 1.5rem; }
    
    .refresh-badge {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      opacity: 0.7;
    }
    
    .live-clock {
      font-family: var(--mono);
      font-size: 0.9rem;
      color: var(--muted);
      display: flex; align-items: center; gap: 0.5rem;
    }
    
    .pulse-dot {
      width: 8px; height: 8px; background: var(--emerald); border-radius: 50%;
      animation: pulse 2s infinite;
    }
    .pulse-dot.offline { background: var(--red); animation: none; }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
      70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    /* ── GRID LAYOUT ───────────────────────────────────── */
    main {
      flex: 1;
      padding: 2rem;
      display: grid;
      grid-template-columns: 300px 1fr 350px;
      gap: 1.5rem;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
    }

    @media (max-width: 1024px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    /* ── PANELS ────────────────────────────────────────── */
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      backdrop-filter: blur(8px);
      display: flex; flex-direction: column; gap: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .panel:hover {
      border-color: var(--gold-dim);
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }
    .panel-header {
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding-bottom: 0.75rem;
      margin-bottom: 0.5rem;
    }
    .panel-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      color: var(--cream);
      font-weight: 600;
    }
    .panel-content {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.6;
      overflow-y: auto;
      flex: 1;
    }
    
    /* ── CUSTOM WIDGETS ────────────────────────────────── */
    .weather-widget {
      display: flex; flex-direction: column; gap: 0.5rem;
    }
    .weather-temp {
      font-size: 2.5rem; font-family: var(--mono); color: var(--gold);
      font-weight: 500;
    }
    .weather-loc {
      font-weight: 600; color: var(--cream); font-size: 1.1rem;
    }
    .weather-detail {
      font-family: var(--mono);
      font-size: 0.85rem;
      color: var(--muted);
      padding: 0.25rem 0;
    }

    .data-table {
      width: 100%; border-collapse: collapse; margin-top: 0.5rem;
    }
    .data-table th, .data-table td {
      text-align: left; padding: 0.75rem 0.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .data-table th {
      color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .data-table td {
      color: var(--cream); font-family: var(--mono); font-size: 0.9rem;
    }
    
    .market-section-header td {
      color: var(--gold) !important;
      padding-top: 1.5rem !important;
      font-family: 'Outfit', sans-serif !important;
      font-weight: 600 !important;
      font-size: 1rem !important;
    }
    
    .loading-shimmer {
      height: 20px; border-radius: 4px;
      margin-bottom: 0.5rem;
      animation: shimmer 1.5s infinite linear;
      background: linear-gradient(90deg, rgba(255,255,255,0.02) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.02) 75%);
      background-size: 200% 100%;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    
    .error-state {
      color: var(--red);
      font-family: var(--mono);
      font-size: 0.85rem;
      padding: 1rem;
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 8px;
      background: rgba(239, 68, 68, 0.05);
    }
    
    .positive { color: var(--emerald); }
    .negative { color: var(--red); }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>BlogsPro <span style="color: var(--muted); font-weight:400;">/</span> Pulse Dashboard</h1>
    </div>
    <div class="header-right">
      <span class="refresh-badge" id="refreshBadge">Refreshes in 60s</span>
      <div class="live-clock">
        <div class="pulse-dot" id="pulseDot"></div>
        <span id="clockDisplay">00:00:00 UTC</span>
      </div>
    </div>
  </header>

  <main>
    <!-- LEFT: GEO & WEATHER -->
    <div class="panel">
      <div class="panel-header">
        <h2 class="panel-title">Geo Context (Delhi)</h2>
      </div>
      <div class="panel-content" id="weatherContent">
        <div class="loading-shimmer"></div>
        <div class="loading-shimmer" style="width: 70%"></div>
        <div class="loading-shimmer" style="width: 40%"></div>
      </div>
    </div>

    <!-- CENTER: MACRO ECONOMICS -->
    <div class="panel">
      <div class="panel-header">
        <h2 class="panel-title">Macro Economics Pulse</h2>
      </div>
      <div class="panel-content" id="macroContent" style="display:flex; flex-direction:column; gap:2rem;">
        <div id="macroPulseBlock">
          <div class="loading-shimmer"></div>
          <div class="loading-shimmer"></div>
          <div class="loading-shimmer"></div>
        </div>
        <div>
          <h3 style="color:var(--gold); margin-bottom:1rem; font-family:'Outfit';">Economic Calendar</h3>
          <div id="macroCalendarBlock">
            <div class="loading-shimmer"></div>
            <div class="loading-shimmer"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT: FINANCIAL MARKETS -->
    <div class="panel">
      <div class="panel-header">
        <h2 class="panel-title">Live Markets</h2>
      </div>
      <div class="panel-content" id="marketContent">
        <div class="loading-shimmer"></div>
        <div class="loading-shimmer"></div>
        <div class="loading-shimmer"></div>
        <div class="loading-shimmer"></div>
      </div>
    </div>
  </main>

  <script>
    const API_BASE = 'http://localhost:8081';
    const REFRESH_INTERVAL_MS = 60000; // 60 seconds
    let refreshCountdown = 60;

    // ── Clock ────────────────────────────────────────────
    function updateClock() {
      const now = new Date();
      document.getElementById('clockDisplay').textContent =
        now.toISOString().replace('T', ' ').substring(0, 19) + ' UTC';
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ── Refresh countdown badge ──────────────────────────
    setInterval(() => {
      refreshCountdown--;
      if (refreshCountdown <= 0) refreshCountdown = 60;
      document.getElementById('refreshBadge').textContent = `Refreshes in ${refreshCountdown}s`;
    }, 1000);

    // ── Helpers ──────────────────────────────────────────
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function showError(el, message) {
      el.innerHTML = `<div class="error-state">${escapeHtml(message)}</div>`;
    }

    async function fetchAPI(endpoint) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 15000); // 15s timeout
      try {
        const res = await fetch(`${API_BASE}${endpoint}`, { signal: controller.signal });
        clearTimeout(timeoutId);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
      } catch (err) {
        clearTimeout(timeoutId);
        const msg = err.name === 'AbortError' ? 'Request timed out (15s)' : err.message;
        console.error('Fetch failed for', endpoint, msg);
        return { error: msg };
      }
    }

    // ── Render Weather ───────────────────────────────────
    async function renderWeather() {
      const data = await fetchAPI('/data/weather?loc=Delhi');
      const el = document.getElementById('weatherContent');
      
      if (data.error || !data.text) {
        showError(el, `Weather unavailable: ${data.error || 'No data'}`);
        return;
      }
      
      const lines = data.text.split('\n').filter(l => l.trim().length > 0);
      let location = 'Delhi, IN';
      let condition = '';
      let temp = '';
      const detailLines = [];

      lines.forEach(line => {
        if (line.startsWith('[WEATHER:')) {
          // Extract location from header e.g. "[WEATHER: Delhi]"
          const match = line.match(/\[WEATHER:\s*(.+?)\]/);
          if (match) location = match[1].trim();
        } else if (line.startsWith('Condition:')) {
          condition = line.replace('Condition:', '').trim();
        } else if (line.startsWith('Temperature:')) {
          temp = line.replace('Temperature:', '').trim().split(' ')[0]; // e.g. "38°C"
        } else {
          detailLines.push(line.trim());
        }
      });

      const detailsHtml = detailLines
        .map(d => `<div class="weather-detail">${escapeHtml(d)}</div>`)
        .join('');

      el.innerHTML = `
        <div class="weather-widget">
          <div class="weather-loc">${escapeHtml(location)}</div>
          <div class="weather-temp">${escapeHtml(temp)}</div>
          <div style="color:var(--gold-dim); font-size:1.1rem; margin-bottom:1rem;">${escapeHtml(condition)}</div>
          ${detailsHtml}
        </div>
      `;
    }

    // ── Render Macro Economics ────────────────────────────
    async function renderMacro() {
      const data = await fetchAPI('/data/economics');
      const pulseEl = document.getElementById('macroPulseBlock');
      const calEl = document.getElementById('macroCalendarBlock');
      
      if (data.error) {
        showError(pulseEl, `Economics unavailable: ${data.error}`);
        calEl.innerHTML = '';
        return;
      }

      // ── Pulse section ──
      const pulse = data.pulse;
      if (pulse && !pulse.error) {
        // pulse has { summary: "...", raw: { india: "8.20", us: "3.50", eu: "0.90" } }
        const raw = pulse.raw || {};
        const metrics = {
          'India GDP Growth': raw.india ? `${raw.india}%` : 'N/A',
          'US CPI (Inflation)': raw.us ? `${raw.us}%` : 'N/A',
          'EU GDP Growth': raw.eu ? `${raw.eu}%` : 'N/A'
        };

        let tableHtml = '<table class="data-table"><thead><tr><th>Metric</th><th>Value</th></tr></thead><tbody>';
        for (const [key, val] of Object.entries(metrics)) {
          tableHtml += `<tr><td>${escapeHtml(key)}</td><td>${escapeHtml(val)}</td></tr>`;
        }
        tableHtml += '</tbody></table>';
        pulseEl.innerHTML = tableHtml;
      } else {
        const fallbackMsg = pulse?.summary || pulse?.error || 'No macro data available';
        pulseEl.innerHTML = `<p style="color:var(--muted)">${escapeHtml(fallbackMsg)}</p>`;
      }

      // ── Calendar section ──
      const calendar = data.calendar;
      if (calendar && calendar.text) {
        calEl.innerHTML = DOMPurify.sanitize(marked.parse(calendar.text));
      } else if (calendar && calendar.raw && calendar.raw.length > 0) {
        let calHtml = '<table class="data-table"><thead><tr><th>Event</th><th>Country</th></tr></thead><tbody>';
        calendar.raw.forEach(evt => {
          calHtml += `<tr><td>${escapeHtml(evt.title || '')}</td><td>${escapeHtml(evt.country || '')}</td></tr>`;
        });
        calHtml += '</tbody></table>';
        calEl.innerHTML = calHtml;
      } else {
        calEl.innerHTML = '<p style="color:var(--muted)">No high-impact events detected.</p>';
      }
    }

    // ── Render Markets ───────────────────────────────────
    async function renderMarkets() {
      const data = await fetchAPI('/data/markets');
      const el = document.getElementById('marketContent');
      
      if (data.error || !data.text) {
        showError(el, `Markets unavailable: ${data.error || 'No data'}`);
        return;
      }
      
      const lines = data.text.split('\n').filter(l => l.trim().length > 0);
      let tableHtml = '<table class="data-table"><tbody>';
      
      lines.forEach(line => {
        const trimmed = line.trim();
        // Section headers: lines starting with [ or containing only non-colon text
        if (trimmed.startsWith('[') || trimmed.startsWith('=')) {
          const headerText = trimmed.replace(/[\[\]=]/g, '').trim();
          tableHtml += `<tr class="market-section-header"><td colspan="2">${escapeHtml(headerText)}</td></tr>`;
        } else if (trimmed.startsWith('- ') && trimmed.includes(':')) {
          // Data rows: "- S&P 500 (^GSPC): 5500 (+0.50%)"
          const withoutDash = trimmed.substring(2);
          const colonIdx = withoutDash.indexOf(':');
          const name = withoutDash.substring(0, colonIdx).trim();
          const val = withoutDash.substring(colonIdx + 1).trim();
          
          // Color the value based on + or - percentage
          let valueClass = '';
          if (val.includes('+')) valueClass = 'positive';
          else if (val.includes('-')) valueClass = 'negative';
          
          tableHtml += `<tr>
            <td style="font-family:var(--sans)">${escapeHtml(name)}</td>
            <td style="text-align:right" class="${valueClass}">${escapeHtml(val)}</td>
          </tr>`;
        } else if (trimmed.includes(':')) {
          // Generic key:value fallback
          const colonIdx = trimmed.indexOf(':');
          const name = trimmed.substring(0, colonIdx).trim();
          const val = trimmed.substring(colonIdx + 1).trim();
          tableHtml += `<tr>
            <td style="font-family:var(--sans)">${escapeHtml(name)}</td>
            <td style="text-align:right">${escapeHtml(val)}</td>
          </tr>`;
        }
      });
      
      tableHtml += '</tbody></table>';
      el.innerHTML = tableHtml;
    }

    // ── Initialization & Auto-refresh ────────────────────
    let isOnline = false;

    async function refreshAll() {
      refreshCountdown = 60;
      try {
        await Promise.all([
          renderWeather(),
          renderMacro(),
          renderMarkets()
        ]);
        isOnline = true;
      } catch (e) {
        isOnline = false;
        console.error('Dashboard refresh failed:', e);
      }
      document.getElementById('pulseDot').className = isOnline ? 'pulse-dot' : 'pulse-dot offline';
    }

    // Initial load
    refreshAll().then(() => console.log('Dashboard loaded'));

    // Auto-refresh every 60 seconds
    setInterval(refreshAll, REFRESH_INTERVAL_MS);
  </script>
</body>
</html>
