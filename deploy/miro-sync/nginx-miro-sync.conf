# /etc/nginx/sites-available/sync.blogspro.in — TLS front for the MiroSync service.
# Own hostname on purpose: the /terminal page fetches root-relative paths (/telemetry, /sync, ...),
# so it cannot live under a path prefix of blogspro.in.
# Cert: certbot --nginx -d sync.blogspro.in (or DNS-01) once DNS points here.

map $http_upgrade $miro_connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=miro_sync:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name sync.blogspro.in;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sync.blogspro.in;

    ssl_certificate     /etc/letsencrypt/live/sync.blogspro.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sync.blogspro.in/privkey.pem;

    client_max_body_size 5m;

    location / {
        limit_req zone=miro_sync burst=40 nodelay;
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade pass-through (Yjs sync on any path).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $miro_connection_upgrade;
        # Long-lived sockets; Yjs clients reconnect on their own if this ever trips.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
